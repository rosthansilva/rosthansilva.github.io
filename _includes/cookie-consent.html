{% if jekyll.environment == 'production' and site.data.settings.google-analytics %}

<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js" data-cfasync="false"></script>

<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.data.settings.google-analytics }}"></script>

<script>
    function getCookie(name) {
        var b = document.cookie.match('(^|[^;]+)\\s*' + name + '\\s*=\\s*([^;]+)');
        return b ? b.pop() : '';
    }

    function addAnalytics() {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '{{ site.data.settings.google-analytics }}');
    }

    window.addEventListener("load", function () {
        const cookieConsent = getCookie('cookieconsent_status');

        if (cookieConsent === 'allow' || cookieConsent === '') {
            addAnalytics();
        }

        window.cookieconsent.initialise({
            "palette": {
                "popup": { "background": "#efefef", "text": "#404040" },
                "button": { "background": "#8ec760", "text": "#ffffff" }
            },
            "type": "opt-out",
            "content": {
                "message": "{{ site.data.settings[page.lang].cookie.message }}",
                "dismiss": "{{ site.data.settings[page.lang].cookie.allow }}",
                "deny": "{{ site.data.settings[page.lang].cookie.deny }}",
                "link": "{{ site.data.settings[page.lang].cookie.link }}",
                "allow": "{{ site.data.settings[page.lang].cookie.allow }}"
            },
            onStatusChange: function (status, chosenBefore) {
                location.reload();
            }
        })
    });
</script>
{% endif %}
