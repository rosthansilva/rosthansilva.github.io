<div class="search">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="search__box">
          <div class="search__group">
            <div class="search__close">
              <i class="ion ion-ios-close-circle-outline"></i>
            </div>
            
            <label for="js-search-input" class="screen-reader-text">
              {{ site.data.settings[page.lang].search.label | default: "Busca" }}
            </label>
            
            <input type="text" id="js-search-input" class="search__text" 
                   autocomplete="off" 
                   placeholder="{{ site.data.settings[page.lang].search.placeholder | default: 'Digite aqui...' }}"
                   data-lang="{{ page.lang }}">
          </div>
          <ul id="js-results-container" class="search-results-list"></ul>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ site.baseurl }}/js/vendors/jquery-3.3.1.min.js"></script>
<script src="{{ site.baseurl }}/js/vendors/simple-jekyll-search.min.js"></script>

<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById("js-search-input"),
    resultsContainer: document.getElementById("js-results-container"),
    
    // FIX: Aqui o script escolhe qual banco de dados carregar (PT ou EN)
    json: "{{ site.baseurl }}/{% if page.lang == 'en' %}en{% else %}pt{% endif %}/search.json",
    
    searchResultTemplate: '<li class="search-results__item"><a class="search-results__link" href="{url}">{title}</a><br> <span class="search-results__date">{date}</span></li>',
    
    // Tradução da frase de erro diretamente no script
    noResultsText: '<li class="no-results">{% if page.lang == "en" %}No results found{% else %}Nenhum resultado encontrado{% endif %}</li>'
  });
</script>

<script src="{{ site.baseurl }}/js/vendors/transition.js"></script>
<script src="{{ site.baseurl }}/js/vendors/zoom.min.js"></script>
<script src="{{ site.baseurl }}/js/vendors/instafeed.min.js"></script>
<script src="{{ site.baseurl }}/js/vendors/jquery.fitvids.js"></script>
<script src="{{ site.baseurl }}/js/common.js"></script>
